name: GorillaLuxe CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-build-test:
    name: Build (MSVC) + Phase 1 WHPX + Phase 2 DX12/CAS self-tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: rustfmt gate
        run: cargo fmt --all -- --check

      - name: clippy gate (zero warnings)
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      - name: Check WHPX availability on runner
        shell: pwsh
        run: |
          $svc = Get-Service -Name vmcompute -ErrorAction SilentlyContinue
          Write-Host "vmcompute service: $($svc.Status)"
          $feature = Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform -ErrorAction SilentlyContinue
          Write-Host "HypervisorPlatform feature: $($feature.State)"

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --release --locked

      - name: Phase 1 acceptance — WHPX vCPU smoke test
        shell: pwsh
        run: |
          .\target\release\gorillaluxe-cli.exe --self-test --lang en
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE1-CI: gorillaluxe-cli --self-test exited 0"
          .\target\release\gorillaluxe-cli.exe --self-test --lang ru
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE1-CI: RU locale run exited 0"

      - name: Phase 2 acceptance — DX12 zero-copy + CAS + Luxe Dark UI
        shell: pwsh
        run: |
          # Automated Verification Test 2: shared texture import via
          # OpenSharedHandle + shared fence, HLSL CAS SSIM>=0.99,
          # Cyrillic atlas coverage, RU/EN hot-swap <1ms, flip swapchain.
          .\target\release\gorillaluxe-cli.exe --self-test-gfx --ci-software-gpu --lang en
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE2-CI: gorillaluxe-cli --self-test-gfx exited 0"
          .\target\release\gorillaluxe-cli.exe --self-test-gfx --ci-software-gpu --lang ru
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE2-CI: RU locale run exited 0"

      - name: Phase 3 acceptance — Infinite Swipe, WASAPI, keymap roundtrip
        shell: pwsh
        run: |
          # Automated Verification Test 3: 10,000 px continuous motion,
          # ABS_MT_TRACKING_ID cycling <2ms, no screen-bound stall,
          # WASAPI init/fallback, keymap.json roundtrip.
          .\target\release\gorillaluxe-cli.exe --self-test-input --lang en
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE3-CI: gorillaluxe-cli --self-test-input exited 0"
          .\target\release\gorillaluxe-cli.exe --self-test-input --lang ru
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE3-CI: RU locale run exited 0"

      - name: Phase 4 acceptance — long mode, downloader, AVD, shm, manifests
        shell: pwsh
        run: |
          # Automated Verification Test 4: 64-bit Long Mode WHPX guest,
          # live dl.google.com manifest resolve (emulator + platform-tools
          # + api-33 x86_64 sysimg), native ureq+zip real-archive download,
          # AVD/config.ini strict validation, raw screencap header parse,
          # atlas streak check, profiles/sensors/shm/lz4/cpu-pinning.
          .\target\release\gorillaluxe-cli.exe --self-test-phase4 --lang en
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE4-CI: gorillaluxe-cli --self-test-phase4 exited 0"
          .\target\release\gorillaluxe-cli.exe --self-test-phase4 --lang ru
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE4-CI: RU locale run exited 0"

      - name: Package GorillaLuxe-Win64.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\gorillaluxe.exe, target\release\gorillaluxe-cli.exe dist\
          Copy-Item README.md, SPECIFICATION.txt, ARCHITECTURE.md dist\
          # Integrity manifest so users can verify the binaries.
          Get-FileHash dist\gorillaluxe.exe, dist\gorillaluxe-cli.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File dist\SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path dist\* -DestinationPath GorillaLuxe-Win64.zip
          $size = (Get-Item GorillaLuxe-Win64.zip).Length / 1MB
          Write-Host ("GorillaLuxe-Win64.zip: {0:N1} MB" -f $size)
          if ($size -gt 35) { Write-Error "artifact exceeds 35 MB budget"; exit 1 }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: GorillaLuxe-Win64
          path: GorillaLuxe-Win64.zip
          if-no-files-found: error
          retention-days: 30
